openapi: 3.0.3
info:
  title: Lynk API
  description: Backend API with Express, TypeScript, PostgreSQL
  version: 1.0.0
servers:
  - url: http://127.0.0.1:43124
    description: Development server
paths:
  /api/health:
    get:
      summary: Health check
      description: Returns API and database status
      operationId: getHealth
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/tools:
    get:
      summary: List agent tools
      description: Returns Zod-described tool descriptors (session or x-agent-key)
      operationId: listTools
      tags:
        - Tools
      security:
        - AgentKey: []
        - SessionCookie: []
      responses:
        "200":
          description: Tool catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/ToolDescriptor"
        "401":
          description: Unauthorized
  /api/tools/{name}:
    post:
      summary: Invoke an agent tool
      description: Runs a named tool with JSON body input (session or x-agent-key)
      operationId: runTool
      tags:
        - Tools
      security:
        - AgentKey: []
        - SessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum:
              - health.check
              - creators.match
              - creators.enqueue_sync
              - creators.compare
              - shortlist.list
              - shortlist.add
              - shortlist.remove
              - shortlist.group
              - roi.estimate
              - campaigns.preview
              - campaigns.create
              - applications.incoming
              - applications.decide
              - marketplace.search
              - applications.mine
              - applications.apply
              - applications.withdraw
              - insights.public
              - messages.status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                  result: {}
        "400":
          description: Invalid input or tool failure
        "401":
          description: Unauthorized
        "403":
          description: Role or agent-key allowlist rejected the tool
        "404":
          description: Unknown tool
        "429":
          description: Per-user agent turn limit
  /api/home:
    get:
      summary: Signed-in home briefing
      description: Role briefing plus plan. sideBySide is true only for plan=pro.
      operationId: getHome
      tags: [Home]
      responses:
        "200":
          description: Briefing
        "401":
          description: Unauthorized
        "403":
          description: Admin has no chat home
  /api/shortlist:
    get:
      summary: Brand shortlist
      operationId: listShortlist
      tags: [Shortlist]
      responses:
        "200":
          description: Groups and items owned by the brand
        "401":
          description: Unauthorized
        "403":
          description: Influencers cannot shortlist
components:
  securitySchemes:
    AgentKey:
      type: apiKey
      in: header
      name: x-agent-key
    SessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          example: connected
    ToolDescriptor:
      type: object
      required: [name, description, inputSchema, outputSchema]
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
